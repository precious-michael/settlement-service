services:
  mysql:
    image: mysql:8.0
    container_name: settlement-service-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: settlement_service
      MYSQL_USER: settlement
      MYSQL_PASSWORD: settlement
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
